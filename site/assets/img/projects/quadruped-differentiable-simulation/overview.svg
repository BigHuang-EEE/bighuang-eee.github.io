<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-labelledby="title desc">
  <title id="title">Learning through physics — method overview</title>
  <desc id="desc">MJX simulation connects to analytical policy gradients and a learned locomotion policy. JAX / MJX provides differentiable physics; APG provides policy learning. Research schematic by Xiwen Huang.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FCFDFF"/>
      <stop offset="1" stop-color="#F3F5FA"/>
    </linearGradient>
  </defs>
  <rect width="720" height="450" rx="24" fill="url(#background)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="36" y="37" font-size="16" font-weight="600" letter-spacing="2" fill="#627087">METHOD OVERVIEW</text>
    <text x="36" y="83" font-size="32" font-weight="600" letter-spacing="-1" fill="#17212F">Learning through physics</text>
    <rect x="30" y="128" width="188" height="133" rx="20" fill="#FFFFFF" stroke="#DFE5EE" stroke-width="1.25"/>
    <text x="124" y="185" text-anchor="middle" font-size="25" font-weight="600" letter-spacing="-0.55" fill="#17212F">MJX</text>
    <text x="124" y="220" text-anchor="middle" font-size="25" font-weight="500" letter-spacing="-0.55" fill="#344259">simulation</text>
    <rect x="266" y="128" width="188" height="133" rx="20" fill="#EDF3FF" stroke="#CDDDF8" stroke-width="1.25"/>
    <text x="360" y="185" text-anchor="middle" font-size="25" font-weight="600" letter-spacing="-0.55" fill="#17212F">Analytical</text>
    <text x="360" y="220" text-anchor="middle" font-size="25" font-weight="500" letter-spacing="-0.55" fill="#344259">policy gradient</text>
    <rect x="502" y="128" width="188" height="133" rx="20" fill="#FFFFFF" stroke="#DFE5EE" stroke-width="1.25"/>
    <text x="596" y="185" text-anchor="middle" font-size="25" font-weight="600" letter-spacing="-0.55" fill="#17212F">Locomotion</text>
    <text x="596" y="220" text-anchor="middle" font-size="25" font-weight="500" letter-spacing="-0.55" fill="#344259">policy</text>
    <path d="M230 194.5h24m-7-7 7 7-7 7" fill="none" stroke="#245BDF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
