    <text x="190" y="383" text-anchor="middle" font-size="22" font-weight="400" letter-spacing="-0.3" fill="#526075">Differentiable physics</text>
    <text x="530" y="349" text-anchor="middle" font-size="48" font-weight="600" letter-spacing="-1.8" fill="#245BDF">APG</text>
    <text x="530" y="383" text-anchor="middle" font-size="22" font-weight="400" letter-spacing="-0.3" fill="#526075">Policy learning</text>
    <text x="360" y="428" text-anchor="middle" font-size="14" font-weight="500" letter-spacing="1.5" fill="#68768A">QUADRUPEDAL LOCOMOTION</text>
