<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-labelledby="title desc">
  <title id="title">Learning when to abstain — method overview</title>
  <desc id="desc">Question-answer data is used to fine-tune TinyLlama-1.1B with PEFT. The model produces an answer or a learned abstention token, &lt;idk&gt;. Research schematic by Xiwen Huang.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FCFDFF"/>
      <stop offset="1" stop-color="#F3F5FA"/>
    </linearGradient>
  </defs>
  <rect width="720" height="450" rx="24" fill="url(#background)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="36" y="37" font-size="16" font-weight="600" letter-spacing="2" fill="#627087">METHOD OVERVIEW</text>
    <text x="36" y="83" font-size="32" font-weight="600" letter-spacing="-1" fill="#17212F">Learning when to abstain</text>
    <rect x="30" y="128" width="188" height="133" rx="20" fill="#FFFFFF" stroke="#DFE5EE" stroke-width="1.25"/>
    <text x="124" y="185" text-anchor="middle" font-size="25" font-weight="600" letter-spacing="-0.55" fill="#17212F">Q&amp;A</text>
    <text x="124" y="220" text-anchor="middle" font-size="25" font-weight="500" letter-spacing="-0.55" fill="#344259">dataset</text>
    <rect x="266" y="128" width="188" height="133" rx="20" fill="#F0EEFC" stroke="#D5CEF4" stroke-width="1.25"/>
    <text x="360" y="185" text-anchor="middle" font-size="25" font-weight="600" letter-spacing="-0.55" fill="#17212F">TinyLlama</text>
    <text x="360" y="220" text-anchor="middle" font-size="25" font-weight="500" letter-spacing="-0.55" fill="#344259">+ PEFT</text>
    <rect x="502" y="128" width="188" height="133" rx="20" fill="#FFFFFF" stroke="#DFE5EE" stroke-width="1.25"/>
    <text x="596" y="185" text-anchor="middle" font-size="25" font-weight="600" letter-spacing="-0.55" fill="#17212F">Answer</text>
    <text x="596" y="220" text-anchor="middle" font-size="25" font-weight="500" letter-spacing="-0.55" fill="#344259">or &lt;idk&gt;</text>
    <path d="M230 194.5h24m-7-7 7 7-7 7" fill="none" stroke="#6552D9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M466 194.5h24m-7-7 7 7-7 7" fill="none" stroke="#6552D9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M36 298H684M360 321V382" fill="none" stroke="#DFE5EE" stroke-width="1"/>
    <text x="190" y="349" text-anchor="middle" font-size="48" font-weight="600" letter-spacing="-1.8" fill="#6552D9">1.1B</text>
    <text x="190" y="383" text-anchor="middle" font-size="22" font-weight="400" letter-spacing="-0.3" fill="#526075">Model parameters</text>
    <text x="530" y="349" text-anchor="middle" font-size="48" font-weight="600" letter-spacing="-1.8" fill="#6552D9">&lt;idk&gt;</text>
    <text x="530" y="383" text-anchor="middle" font-size="22" font-weight="400" letter-spacing="-0.3" fill="#526075">Learned abstention</text>
    <text x="360" y="428" text-anchor="middle" font-size="14" font-weight="500" letter-spacing="1.5" fill="#68768A">PARAMETER-EFFICIENT FINE-TUNING</text>
  </g>
</svg>
