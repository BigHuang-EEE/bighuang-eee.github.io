<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-labelledby="title desc">
  <title id="title">Learning when to abstain — method overview</title>
  <desc id="desc">Question-answer data is used to fine-tune TinyLlama-1.1B with PEFT. The model produces an answer or a learned abstention token, &lt;idk&gt;. Research schematic by Xiwen Huang.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#16191F"/>
      <stop offset="1" stop-color="#0E1117"/>
    </linearGradient>
  </defs>
  <rect width="720" height="450" rx="24" fill="url(#background)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="36" y="37" font-size="16" font-weight="600" letter-spacing="2" fill="#9AA9C0">METHOD OVERVIEW</text>
    <text x="36" y="83" font-size="32" font-weight="600" letter-spacing="-1" fill="#F3F6FB">Learning when to abstain</text>
    <rect x="30" y="128" width="188" height="133" rx="20" fill="#1D222C" stroke="#343D4D" stroke-width="1.25"/>
    <text x="124" y="185" text-anchor="middle" font-size="25" font-weight="600" letter-spacing="-0.55" fill="#F3F6FB">Q&amp;A</text>
    <text x="124" y="220" text-anchor="middle" font-size="25" font-weight="500" letter-spacing="-0.55" fill="#CFD7E6">dataset</text>
    <rect x="266" y="128" width="188" height="133" rx="20" fill="#2A2546" stroke="#4B416D" stroke-width="1.25"/>
    <text x="360" y="185" text-anchor="middle" font-size="25" font-weight="600" letter-spacing="-0.55" fill="#F3F6FB">TinyLlama</text>
    <text x="360" y="220" text-anchor="middle" font-size="25" font-weight="500" letter-spacing="-0.55" fill="#CFD7E6">+ PEFT</text>
    <rect x="502" y="128" width="188" height="133" rx="20" fill="#1D222C" stroke="#343D4D" stroke-width="1.25"/>
    <text x="596" y="185" text-anchor="middle" font-size="25" font-weight="600" letter-spacing="-0.55" fill="#F3F6FB">Answer</text>
    <text x="596" y="220" text-anchor="middle" font-size="25" font-weight="500" letter-spacing="-0.55" fill="#CFD7E6">or &lt;idk&gt;</text>
    <path d="M230 194.5h24m-7-7 7 7-7 7" fill="none" stroke="#AC9DFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M466 194.5h24m-7-7 7 7-7 7" fill="none" stroke="#AC9DFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M36 298H684M360 321V382" fill="none" stroke="#343D4D" stroke-width="1"/>
    <text x="190" y="349" text-anchor="middle" font-size="48" font-weight="600" letter-spacing="-1.8" fill="#AC9DFF">1.1B</text>
    <text x="190" y="383" text-anchor="middle" font-size="22" font-weight="400" letter-spacing="-0.3" fill="#AAB7CA">Model parameters</text>
    <text x="530" y="349" text-anchor="middle" font-size="48" font-weight="600" letter-spacing="-1.8" fill="#AC9DFF">&lt;idk&gt;</text>
    <text x="530" y="383" text-anchor="middle" font-size="22" font-weight="400" letter-spacing="-0.3" fill="#AAB7CA">Learned abstention</text>
    <text x="360" y="428" text-anchor="middle" font-size="14" font-weight="500" letter-spacing="1.5" fill="#93A3BC">PARAMETER-EFFICIENT FINE-TUNING</text>
  </g>
</svg>
