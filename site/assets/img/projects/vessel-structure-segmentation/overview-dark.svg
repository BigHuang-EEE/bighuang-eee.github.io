<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-labelledby="title desc">
  <title id="title">Preserving vessel structure — method overview</title>
  <desc id="desc">Multi-modal images pass through prompt fusion and dual attention to produce vessel segmentation. Reported gains are +0.87 in average Dice and +1.80 in average clDice on 7 2D datasets. Research schematic by Xiwen Huang.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#16191F"/>
      <stop offset="1" stop-color="#0E1117"/>
    </linearGradient>
  </defs>
  <rect width="720" height="450" rx="24" fill="url(#background)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="36" y="37" font-size="16" font-weight="600" letter-spacing="2" fill="#9AA9C0">METHOD OVERVIEW</text>
    <text x="36" y="83" font-size="32" font-weight="600" letter-spacing="-1" fill="#F3F6FB">Preserving vessel structure</text>
    <rect x="30" y="128" width="188" height="133" rx="20" fill="#1D222C" stroke="#343D4D" stroke-width="1.25"/>
    <text x="124" y="185" text-anchor="middle" font-size="25" font-weight="600" letter-spacing="-0.55" fill="#F3F6FB">Multi-modal</text>
    <text x="124" y="220" text-anchor="middle" font-size="25" font-weight="500" letter-spacing="-0.55" fill="#CFD7E6">images</text>
    <rect x="266" y="128" width="188" height="133" rx="20" fill="#282A46" stroke="#454A70" stroke-width="1.25"/>
    <text x="360" y="185" text-anchor="middle" font-size="25" font-weight="600" letter-spacing="-0.55" fill="#F3F6FB">Prompt fusion</text>
    <text x="360" y="220" text-anchor="middle" font-size="25" font-weight="500" letter-spacing="-0.55" fill="#CFD7E6">Dual attention</text>
    <rect x="502" y="128" width="188" height="133" rx="20" fill="#1D222C" stroke="#343D4D" stroke-width="1.25"/>
    <text x="596" y="185" text-anchor="middle" font-size="25" font-weight="600" letter-spacing="-0.55" fill="#F3F6FB">Vessel</text>
    <text x="596" y="220" text-anchor="middle" font-size="25" font-weight="500" letter-spacing="-0.55" fill="#CFD7E6">segmentation</text>
    <path d="M230 194.5h24m-7-7 7 7-7 7" fill="none" stroke="#A4A9FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M466 194.5h24m-7-7 7 7-7 7" fill="none" stroke="#A4A9FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M36 298H684M360 321V382" fill="none" stroke="#343D4D" stroke-width="1"/>
    <text x="190" y="349" text-anchor="middle" font-size="48" font-weight="600" letter-spacing="-1.8" fill="#A4A9FF">+0.87</text>
    <text x="190" y="383" text-anchor="middle" font-size="22" font-weight="400" letter-spacing="-0.3" fill="#AAB7CA">Average Dice</text>
    <text x="530" y="349" text-anchor="middle" font-size="48" font-weight="600" letter-spacing="-1.8" fill="#A4A9FF">+1.80</text>
    <text x="530" y="383" text-anchor="middle" font-size="22" font-weight="400" letter-spacing="-0.3" fill="#AAB7CA">Average clDice</text>
    <text x="360" y="428" text-anchor="middle" font-size="14" font-weight="500" letter-spacing="1.5" fill="#93A3BC">EVALUATED ON 7 2D DATASETS</text>
  </g>
</svg>
